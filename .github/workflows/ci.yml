name: CI

on:
  push:
    branches: [main]
  pull_request:

# Este workflow solo lee el repositorio: nada de lo que hace necesita permiso de escritura
# sobre el GITHUB_TOKEN. Declararlo aqui mantiene el minimo privilegio aunque cambie el
# ajuste por defecto de la cuenta o alguien copie el workflow a otro repositorio.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # El proyecto "storybook" de Vitest ejecuta las stories en Chromium.
      - name: Install Chromium for Vitest browser mode
        run: npx playwright install --with-deps chromium

      # `npm run build` solo compila `src` y `vite.config.ts`; las funciones de `convex/`
      # quedaban fuera de todo control de tipos, asi que `lint` las comprueba aparte.
      - name: Lint (auditoria DS + ds:check + ESLint + tipos de Convex)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
